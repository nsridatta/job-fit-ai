spring:
  application:
    name: resume-ai-backend
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}  # This will be loaded from .env file
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: nvidia/nemotron-3-nano-30b-a3b:free
    retry:
      max-attempts: 3
      initial-interval: 2000ms
      multiplier: 2.0
      max-interval: 1000ms

server:
  port: 8080

logging:
  level:
    root: INFO

resume:
  local:
    enabled: true
    model-path: models/flan-t5-small
